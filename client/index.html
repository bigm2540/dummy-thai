<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ดัมมี่ไทย 🎴</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ข้อความแจ้งเตือนชั่วคราว -->
  <div id="toast" class="toast hidden"></div>

  <!-- ===== จอ 1: ล็อบบี้ ===== -->
  <section id="screen-lobby" class="screen">
    <div class="card-panel">
      <h1>🎴 ดัมมี่ไทย</h1>
      <input id="name-input" maxlength="12" placeholder="ชื่อของคุณ" />
      <div class="rate-row">
        <span class="rate-label">เรทเงิน (บาท/คะแนน)</span>
        <div class="rate-opts" id="rate-opts">
          <button type="button" class="rate-opt active" data-rate="1">1</button>
          <button type="button" class="rate-opt" data-rate="5">5</button>
          <button type="button" class="rate-opt" data-rate="10">10</button>
          <button type="button" class="rate-opt" data-rate="20">20</button>
        </div>
      </div>
      <button id="btn-create" class="primary">สร้างห้องใหม่</button>
      <div class="divider">หรือ</div>
      <input id="code-input" maxlength="4" placeholder="รหัสห้อง (4 ตัว)" style="text-transform:uppercase" />
      <button id="btn-join">เข้าห้อง</button>
    </div>
  </section>

  <!-- ===== จอ 2: ห้องรอ ===== -->
  <section id="screen-waiting" class="screen hidden">
    <div class="card-panel">
      <h2>ห้อง <span id="room-code" class="code"></span></h2>
      <p class="hint">ชวนเพื่อนด้วยการแชร์ลิงก์ หรือบอกรหัสห้อง — เริ่มได้เมื่อครบ 4 คน</p>
      <div id="share-box" style="display:flex;flex-direction:column;gap:8px;margin:4px 0 10px">
        <button id="btn-share" class="primary">🔗 แชร์ลิงก์ห้องให้เพื่อน</button>
        <button id="btn-copy-link">คัดลอกลิงก์</button>
      </div>
      <ul id="waiting-players" class="player-list"></ul>
      <button id="btn-start" class="primary hidden">เริ่มเกม</button>
      <p id="waiting-hint" class="hint"></p>
      <button id="btn-leave">ออกจากห้อง</button>
    </div>
  </section>

  <!-- ===== จอ 3: โต๊ะเล่น (ที่นั่ง 2 ซ้าย/2 ขวา · บอร์ดกลาง 4 โซนเกิด + แถบกองทิ้งกลาง) ===== -->
  <section id="screen-table" class="screen hidden">
    <div class="table-grid">
      <div class="mid">
        <!-- ที่นั่ง 4 คน: ซ้ายบน=tl, ขวาบน=tr, ซ้ายล่าง=เรา, ขวาล่าง=br -->
        <div class="seat-chip" data-slot="tl"></div>
        <div class="seat-chip" data-slot="tr"></div>
        <div class="seat-chip me" data-slot="me"></div>
        <div class="seat-chip" data-slot="br"></div>

        <!-- บอร์ดกลาง: โซนเกิด 4 ช่อง + แถบกองทิ้งกลาง + ปุ่มลอย -->
        <div class="board">
          <div class="meldrow top">
            <div class="meldzone" data-mz="tl"></div>
            <div class="meldzone" data-mz="tr"></div>
          </div>
          <div class="discard-band">
            <div class="stock">
              <div class="card-back lg" id="stock-pile"></div>
              <div class="stock-count" id="stock-count">0</div>
            </div>
            <div id="discard-pile" class="discard-pile"></div>
          </div>
          <div class="meldrow bottom">
            <div class="meldzone" data-mz="me"></div>
            <div class="meldzone" data-mz="br"></div>
          </div>
          <!-- ปุ่มจังหวะ (ลอยกลาง-ล่างบอร์ด) -->
          <div class="action-float">
            <div id="hint-bar" class="hint-bar"></div>
            <div id="action-bar" class="action-bar"></div>
          </div>
        </div>
      </div>

      <!-- แถบไพ่มือ (ล่างสุด เต็มกว้าง) + ปุ่มเรียง -->
      <div class="tray">
        <div class="tray-top">
          <button id="btn-money" class="money-btn">💰 เงิน</button>
          <div id="status-bar" class="status-bar"></div>
          <div class="sort-btns">
            <button id="btn-sort-suit" class="sort-btn">⬛ ดอก</button>
            <button id="btn-sort-rank" class="sort-btn">🔢 เลข</button>
          </div>
        </div>
        <div id="my-hand" class="my-hand"></div>
      </div>
    </div>
  </section>

  <!-- ===== จอ 4: สรุปรอบ / จบแมตช์ ===== -->
  <section id="screen-summary" class="screen hidden">
    <div class="card-panel wide">
      <h2 id="summary-title">สรุปรอบ</h2>
      <table id="summary-table" class="summary-table"></table>
      <div id="summary-actions"></div>
    </div>
  </section>

  <!-- popup: เงินสะสมของทุกคน (ดูได้ตลอด) -->
  <div id="money-popup" class="overlay hidden">
    <div class="card-panel">
      <h3>💰 เงิน/คะแนนปัจจุบัน</h3>
      <table id="money-table" class="summary-table"></table>
      <button id="money-close" class="primary">ปิด</button>
    </div>
  </div>

  <!-- popup: host ตัดสินใจเมื่อมีคนหลุดเกิน grace -->
  <div id="dc-popup" class="overlay hidden">
    <div class="card-panel">
      <h3 id="dc-text">มีผู้เล่นหลุด</h3>
      <button id="dc-wait">รอต่อ</button>
      <button id="dc-end" class="danger">จบแมตช์</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
